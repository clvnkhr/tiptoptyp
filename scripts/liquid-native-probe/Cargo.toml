[package]
name = "tiptoptyp-liquid-native-probe"
version = "0.1.0"
edition = "2024"
publish = false

# This measures the actual production modules without constructing the editor or
# linking its GUI dependencies. Keep inference/tokenizer versions in sync with
# the application lockfile; the result receipt records the built architecture.
[dependencies]
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["asm"] }
zstd = { version = "0.13.3", default-features = false }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28.0", features = ["signal", "user"] }

[features]
production = []

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Large model integrity checks must stay fast during ordinary cargo run builds.
[profile.dev.package.sha2]
opt-level = 3
