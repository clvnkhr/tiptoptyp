[package]
name = "tiptoptyp-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
zstd = { version = "0.13.3", default-features = false }
sha2 = "0.10"
tempfile = "3.21"

[workspace]

# Packaging compresses hundreds of MB even when the task runner is launched
# with `cargo run`; keep its Zstandard/hash kernels optimized without a release build.
[profile.dev.package.zstd-sys]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
