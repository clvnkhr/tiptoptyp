[package]
name = "tiptoptyp-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license-file = "../LICENSE"

[dependencies]
tar = "0.4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = { version = "0.13.3", default-features = false }
sha2 = { version = "0.10", features = ["asm"] }
tempfile = "3.21"

[workspace]

# Packaging compresses hundreds of MB even when the task runner is launched
# with `cargo run`; keep its Zstandard/hash kernels optimized without a release build.
[profile.dev.package.zstd-sys]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
