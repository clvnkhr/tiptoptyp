name: Desktop UI

on:
  workflow_dispatch:
    inputs:
      journey:
        description: Real editor journey
        type: choice
        options: [
          "all",
          "liquid_selection",
          "liquid_streaming",
          "latexdiff_wizard",
          "tex_documentation",
          "citation_import",
          "file_versions",
          "command_palette",
          "preview_jump",
          "tex",
          "tex_editing",
          "tex_intelligence",
          "tex_save",
          "harper_math_prose",
          "harper_settings",
          "images",
          "problems_focus",
          "preview_find",
          "tables",
          "arxiv_tables",
          "math_grids",
          "drawing",
          "snippets",
          "ime",
          "panels",
          "terminal_find",
          "terminal_load",
          "terminal_theme",
          "find",
          "rectangle",
          "empty",
          "focus",
          "preview",
          "pdf_output",
          "editing",
          "search",
          "tabs",
          "tab_drag",
          "dialogs",
          "startup_preview",
          "diagnostics",
          "completion",
          "layout",
          "pdf_layout",
          "inactive_preview",
          "explorer_toggle",
          "explorer_scroll",
          "folding",
          "selection_wrap",
          "git_hunks",
          "preview_keyboard",
          "pdfium_resize",
          "closing",
          "partial_preview",
          "partial_zoom_stress",
          "partial_cache_edges",
          "partial_dividers",
          "controls",
          "settings_search",
          "editor_preferences",
          "typing_particles",
          "effects_pacing",
          "background",
          "background_fades",
          "context_menu"
        ]
        default: all
      liquid_model_dir:
        description: Prepared native model folder for Liquid journeys (no downloads)
        type: string
        required: false
        default: ""

permissions:
  contents: read

# A dedicated logged-in desktop, not a headless macOS build worker.
concurrency:
  group: desktop-ui
  cancel-in-progress: false

jobs:
  journeys:
    runs-on: [self-hosted, macOS, desktop-ui]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Real editor journeys
        env:
          JOURNEY: ${{ inputs.journey }}
          LIQUID_MODEL_DIR: ${{ inputs.liquid_model_dir }}
        run: |
          args=(--journey "$JOURNEY")
          if [[ -n "$LIQUID_MODEL_DIR" ]]; then
            args+=(--liquid-model-dir "$LIQUID_MODEL_DIR")
          fi
          python3 scripts/test-desktop-ui.py "${args[@]}"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-evidence
          path: .tiptoptyp/desktop-ui-tests/run-*/
          include-hidden-files: true
          if-no-files-found: warn
