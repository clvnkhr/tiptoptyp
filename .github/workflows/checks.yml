name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgtk-3-dev
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.95.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.95.0 clippy --locked --all-targets -- -D warnings
      - name: Application and core tests
        run: cargo +1.95.0 test --locked --no-fail-fast
      - name: Packaging tests
        run: cargo +1.95.0 test --locked --manifest-path xtask/Cargo.toml
      - name: Profiling infrastructure checks
        run: |
          cargo +1.95.0 fmt --manifest-path xtask/Cargo.toml -- --check
          cargo +1.95.0 clippy --locked --all-targets --features profiling -- -D warnings
          cargo +1.95.0 test --locked --features profiling --no-fail-fast

  real-tools:
    name: Real Typst and Tinymist (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Install Poppler
        run: brew install poppler
      - name: Fetch hash-verified pinned sidecars
        run: cargo +1.95.0 run --locked --manifest-path xtask/Cargo.toml -- fetch-sidecars
      - name: Run real-tool integration tests
        shell: bash
        run: |
          target="$(rustc +1.95.0 -vV | sed -n 's/^host: //p')"
          test -n "$target"
          export TIPTOPTYP_TEST_TYPST="$PWD/toolchain/bin/typst-$target"
          export TIPTOPTYP_TEST_TINYMIST="$PWD/toolchain/bin/tinymist-$target"
          test -x "$TIPTOPTYP_TEST_TYPST"
          test -x "$TIPTOPTYP_TEST_TINYMIST"
          cargo +1.95.0 test --locked --bin tiptoptyp -- --ignored --test-threads=1
