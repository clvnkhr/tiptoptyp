name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_windows:
        description: Run the real macOS desktop window contract
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux remains useful portability signal while it is unsupported, but it
    # must not block the macOS release path. Windows is intentionally absent
    # until the project has a concrete support target for it.
    continue-on-error: ${{ matrix.allow_failure }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            allow_failure: false
          - os: ubuntu-latest
            allow_failure: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgtk-3-dev
      - name: Install Zig for libghostty
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Dependency policy
        run: cargo +1.98.1 deny check
      - name: Formatting
        run: cargo +1.98.1 fmt --all -- --check
      - name: Clippy
        run: cargo +1.98.1 clippy --locked --all-targets -- -D warnings
      - name: Application and core tests
        run: cargo +1.98.1 test --locked --no-fail-fast
      - name: Embedded preview interaction tests
        run: node --test scripts/test-preview-navigation.mjs
      - name: Packaging tests
        run: cargo +1.98.1 test --locked --manifest-path xtask/Cargo.toml
      - name: Profiling infrastructure checks
        run: |
          cargo +1.98.1 fmt --manifest-path xtask/Cargo.toml -- --check
          cargo +1.98.1 clippy --locked --all-targets --features profiling -- -D warnings
          cargo +1.98.1 test --locked --features profiling --no-fail-fast

  real-tools:
    name: Real previews and Rust coverage (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Zig for libghostty
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component llvm-tools-preview
      - name: Install coverage runner
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Validate dependency notice generation
        run: cargo about generate --manifest-path Cargo.toml about.hbs > "$RUNNER_TEMP/THIRD_PARTY_RUST_NOTICES"
      - name: Fetch hash-verified pinned sidecars
        run: cargo +1.98.1 run --locked --manifest-path xtask/Cargo.toml -- fetch-sidecars
      - name: Fetch hash-verified PDFium
        run: cargo +1.98.1 run --locked --manifest-path xtask/Cargo.toml -- fetch-pdfium
      - name: Run real-tool integration tests and measure coverage
        shell: bash
        run: |
          target="$(rustc +1.98.1 -vV | sed -n 's/^host: //p')"
          test -n "$target"
          export TIPTOPTYP_TEST_TYPST="$PWD/toolchain/bin/typst-$target"
          export TIPTOPTYP_TEST_TINYMIST="$PWD/toolchain/bin/tinymist-$target"
          test -x "$TIPTOPTYP_TEST_TYPST"
          test -x "$TIPTOPTYP_TEST_TINYMIST"
          cargo +1.98.1 test --locked -p glutin --lib native_thread_current_context -- --ignored
          python3 scripts/measure-coverage.py --real-tools
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/preview-browser" --no-audit --no-fund playwright@1.63.0
          node "$RUNNER_TEMP/preview-browser/node_modules/playwright/cli.js" install chromium
      - name: Real Tinymist browser end-to-end tests
        shell: bash
        run: |
          target="$(rustc +1.98.1 -vV | sed -n 's/^host: //p')"
          export TIPTOPTYP_TEST_TINYMIST="$PWD/toolchain/bin/tinymist-$target"
          export TIPTOPTYP_PLAYWRIGHT="$RUNNER_TEMP/preview-browser/node_modules/playwright"
          node scripts/test-preview-e2e.cjs
      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: .tiptoptyp/coverage/latest
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  native-windows:
    name: Native macOS window contract
    if: github.event_name == 'workflow_dispatch' && inputs.native_windows
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Real native lifecycle and ownership
        run: python3 scripts/test-native-windows.py
      - name: Fetch pinned sidecars for native preview
        run: cargo +1.98.1 run --locked --manifest-path xtask/Cargo.toml -- fetch-sidecars
      - name: Native Tinymist appearance and reload
        shell: bash
        run: |
          target="$(rustc +1.98.1 -vV | sed -n 's/^host: //p')"
          export TIPTOPTYP_TEST_TINYMIST="$PWD/toolchain/bin/tinymist-$target"
          python3 scripts/test-native-preview-palette.py
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-window-contract
          path: |
            .tiptoptyp/native-window-tests/**/result.txt
            .tiptoptyp/screenshots/agent-review/native-preview-palette
          include-hidden-files: true
          if-no-files-found: warn
