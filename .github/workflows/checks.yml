name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_windows:
        description: Run the real macOS desktop window contract
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fast:
    name: Script and browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # These use private fixtures, fake compilers and local servers. They do
      # not need the Rust/GUI build, sidecars or model downloads.
      - name: Local fast checks
        run: sh scripts/check-local.sh fast

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux remains useful portability signal while it is unsupported, but it
    # must not block the macOS release path. Windows is intentionally absent
    # until the project has a concrete support target for it.
    continue-on-error: ${{ matrix.allow_failure }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            allow_failure: false
          - os: ubuntu-latest
            allow_failure: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.98.1 fmt --all -- --check
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Dependency policy
        run: cargo +1.98.1 deny check
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgtk-3-dev
      # Official Zig 0.15.2 cannot read Xcode 26.4+ arm64e-only libc stubs.
      # https://codeberg.org/ziglang/zig/issues/31658
      - name: Select Xcode 26.3 for Zig
        if: runner.os == 'macOS'
        run: |
          developer_dir=/Applications/Xcode_26.3.app/Contents/Developer
          if [ ! -d "$developer_dir" ]; then
            echo "::error::Xcode 26.3 is required by pinned Zig 0.15.2; missing $developer_dir"
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      - name: Install Zig for libghostty
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Verify macOS Zig libc linking
        if: runner.os == 'macOS'
        run: sh scripts/check-macos-zig.sh
      # Select Wry directly: dependency warning caps hide release-only warnings.
      - name: Release WebKit warnings
        if: runner.os == 'macOS'
        env:
          RUSTFLAGS: -D warnings
        run: cargo +1.98.1 check --locked --release -p wry
      - name: Required local Rust checks
        run: sh scripts/check-local.sh rust
      # The fast lane covers Linux flock. Keep the macOS lockf/deletion path
      # on its actual platform as well; the rest of the script suite runs once.
      - name: macOS cache cleanup contracts
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s scripts -p 'test_prune_cargo_incremental_contract.py'
      # Shared behavior runs in the complete default suite above. Compile all
      # supplemental code strictly, then execute the feature-owned contracts.
      # One combined macOS variant avoids a third large application test build.
      - name: Supplemental local feature contracts
        run: sh scripts/check-local.sh features

  real-tools:
    name: Real previews and Rust coverage (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Official Zig 0.15.2 cannot read Xcode 26.4+ arm64e-only libc stubs.
      # https://codeberg.org/ziglang/zig/issues/31658
      - name: Select Xcode 26.3 for Zig
        if: runner.os == 'macOS'
        run: |
          developer_dir=/Applications/Xcode_26.3.app/Contents/Developer
          if [ ! -d "$developer_dir" ]; then
            echo "::error::Xcode 26.3 is required by pinned Zig 0.15.2; missing $developer_dir"
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      - name: Install Zig for libghostty
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Verify macOS Zig libc linking
        if: runner.os == 'macOS'
        run: sh scripts/check-macos-zig.sh
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component llvm-tools-preview
      - name: Install coverage runner
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Validate dependency notice generation
        run: cargo about generate --manifest-path Cargo.toml about.hbs > "$RUNNER_TEMP/THIRD_PARTY_RUST_NOTICES"
      - name: Fetch hash-verified pinned sidecars
        run: cargo +1.98.1 run --locked --manifest-path xtask/Cargo.toml -- fetch-sidecars
      - name: Fetch hash-verified PDFium
        run: cargo +1.98.1 run --locked --manifest-path xtask/Cargo.toml -- fetch-pdfium
      - name: Run real-tool integration tests and measure coverage
        shell: bash
        run: |
          target="$(rustc +1.98.1 -vV | sed -n 's/^host: //p')"
          test -n "$target"
          export TIPTOPTYP_TEST_TYPST="$PWD/toolchain/bin/typst-$target"
          export TIPTOPTYP_TEST_TINYMIST="$PWD/toolchain/bin/tinymist-$target"
          test -x "$TIPTOPTYP_TEST_TYPST"
          test -x "$TIPTOPTYP_TEST_TINYMIST"
          mkdir -p .tiptoptyp/coverage/latest
          cargo +1.98.1 test --locked -p glutin --lib native_thread_current_context -- --ignored 2>&1 | tee .tiptoptyp/coverage/latest/native-context.log
          python3 scripts/measure-coverage.py --real-tools 2>&1 | tee .tiptoptyp/coverage/latest/coverage-run.log
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/preview-browser" --no-audit --no-fund playwright@1.63.0
          node "$RUNNER_TEMP/preview-browser/node_modules/playwright/cli.js" install chromium
      - name: Real Tinymist browser end-to-end tests
        shell: bash
        run: |
          target="$(rustc +1.98.1 -vV | sed -n 's/^host: //p')"
          export TIPTOPTYP_TEST_TINYMIST="$PWD/toolchain/bin/tinymist-$target"
          export TIPTOPTYP_PLAYWRIGHT="$RUNNER_TEMP/preview-browser/node_modules/playwright"
          node scripts/test-preview-e2e.cjs
          node scripts/test-preview-e2e.cjs --large --mode partial --palette-checks --geometry-checks --output .tiptoptyp/profiles/partial-render/ci-partial.json
      - name: Retain partial preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partial-preview
          path: |
            .tiptoptyp/profiles/partial-render
            .tiptoptyp/screenshots/agent-review/partial-render
            .tiptoptyp/screenshots/agent-review/partial-optimize
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: .tiptoptyp/coverage/latest
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  native-windows:
    name: Native macOS window contract
    if: github.event_name == 'workflow_dispatch' && inputs.native_windows
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Official Zig 0.15.2 cannot read Xcode 26.4+ arm64e-only libc stubs.
      # https://codeberg.org/ziglang/zig/issues/31658
      - name: Select Xcode 26.3 for Zig
        if: runner.os == 'macOS'
        run: |
          developer_dir=/Applications/Xcode_26.3.app/Contents/Developer
          if [ ! -d "$developer_dir" ]; then
            echo "::error::Xcode 26.3 is required by pinned Zig 0.15.2; missing $developer_dir"
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Verify macOS Zig libc linking
        if: runner.os == 'macOS'
        run: sh scripts/check-macos-zig.sh
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Real native lifecycle and ownership
        run: python3 scripts/test-native-windows.py
      - name: Fetch pinned sidecars for native preview
        run: cargo +1.98.1 run --locked --manifest-path xtask/Cargo.toml -- fetch-sidecars
      - name: Native Tinymist appearance and reload
        shell: bash
        run: |
          target="$(rustc +1.98.1 -vV | sed -n 's/^host: //p')"
          export TIPTOPTYP_TEST_TINYMIST="$PWD/toolchain/bin/tinymist-$target"
          python3 scripts/test-native-preview-palette.py
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-window-contract
          path: |
            .tiptoptyp/native-window-tests/**/result.txt
            .tiptoptyp/screenshots/agent-review/native-preview-palette
          include-hidden-files: true
          if-no-files-found: warn
