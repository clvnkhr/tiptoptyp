[package]
name = "tiptoptyp"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A fast, native Typst editor with live PDF preview"
publish = false
repository = "https://github.com/calvinkhor/tiptoptyp"

[features]
profiling = []

[dependencies]
tiptoptyp-core = { path = "core" }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_ltreeview = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
notify = "8.2.0"
quick-xml = "0.41"
regex-automata = "0.4.18"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "plist-load", "regex-fancy"] }
tempfile = "3.21.0"
toml = "0.8"
typst-syntax = "0.15.1"
pulldown-cmark = { version = "0.13.1", default-features = false }
ureq = "2.12"
url = "2.5"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
raw-window-handle = "0.6.2"
wry = "0.56.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage", "NSMenu", "NSMenuItem", "NSEvent", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSObject", "NSString", "NSURL"] }
# Keep this exact: the application-open bridge augments this release's
# existing delegate instead of replacing winit's lifecycle integration.
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
tiptoptyp-core = { path = "core", features = ["test-support"] }
egui_kittest = "0.36.1"

[[test]]
name = "native_window_drag"
harness = false

[workspace]
members = ["core"]
default-members = [".", "core"]
exclude = ["xtask"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep production optimizations, but retain names and source locations for samplers.
[profile.profiling]
inherits = "release"
debug = "limited"
split-debuginfo = "packed"
strip = "none"

[package.metadata.packager]
product-name = "tiptoptyp"
identifier = "dev.tiptoptyp.editor"
category = "DeveloperTool"
icons = [
    "assets/icons/tiptoptyp-32.png",
    "assets/icons/tiptoptyp-64.png",
    "assets/icons/tiptoptyp-128.png",
    "assets/icons/tiptoptyp-256.png",
    "assets/icons/tiptoptyp-512.png",
    "assets/icons/tiptoptyp-512@2x.png",
    "assets/icons/tiptoptyp.ico",
]
before-packaging-command = "cargo run --manifest-path xtask/Cargo.toml -- package-build"
external-binaries = ["toolchain/bin/typst", "toolchain/bin/tinymist"]
resources = [
    { src = "THIRD_PARTY_NOTICES", target = "THIRD_PARTY_NOTICES" },
    { src = "toolchain/licenses", target = "licenses" },
    { src = "assets/fonts/notosanssymbols/OFL.txt", target = "licenses/NotoSansSymbols-OFL.txt" },
    { src = "assets/fonts/notosansmath/OFL.txt", target = "licenses/NotoSansMath-OFL.txt" },
    { src = "assets/fonts/notosanssymbols2/OFL.txt", target = "licenses/NotoSansSymbols2-OFL.txt" },
    { src = "assets/fonts/notosanshebrew/OFL.txt", target = "licenses/NotoSansHebrew-OFL.txt" },
    { src = "assets/fonts/README.md", target = "font-provenance.md" },
    { src = "toolchain/provenance", target = "toolchain-provenance" },
]
file-associations = [
    { extensions = ["typ"], name = "Typst document", role = "editor" },
    { extensions = ["txt", "md", "markdown", "json", "toml", "yaml", "yml", "xml", "html", "css", "js", "ts", "rs", "py", "sh"], name = "Text document", role = "editor" },
    { extensions = ["pdf"], name = "PDF document", role = "viewer" },
    { extensions = ["png", "jpg", "jpeg", "gif", "webp", "bmp", "ico", "tif", "tiff"], name = "Image", role = "viewer" },
]

[package.metadata.packager.macos]
# Produces a locally runnable, internally consistent bundle. Distribution
# builds should replace this with their Developer ID identity and notarize.
signing-identity = "-"
