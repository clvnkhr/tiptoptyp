[package]
name = "tiptoptyp"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A fast, native Typst editor with live PDF preview"
publish = false
repository = "https://github.com/calvinkhor/tiptoptyp"

[features]
production = []
profiling = []
native-ui-tests = []
desktop-ui-tests = []

[dependencies]
zstd = { version = "0.13.3", default-features = false }
sha2 = { version = "0.10", features = ["asm"] }
tract-onnx = { version = "0.23.8", default-features = false }
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
tiptoptyp-core = { path = "core" }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_ltreeview = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
# The pre-1.0 C ABI is pinned together with its Rust wrapper.
libghostty-vt = { version = "=0.2.1", default-features = false }
notify = "8.2.0"
portable-pty = "0.9.0"
regex = "1"
regex-automata = "0.4.18"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skrifa = { version = "0.47.0", default-features = false, features = ["std"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "plist-load", "regex-fancy"] }
tempfile = "3.21.0"
toml = "1.1.6"
typst-syntax = "0.15.1"
pulldown-cmark = { version = "0.13.1", default-features = false }
ureq = "3.4.2"
url = "2.5"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
shlex = "1.3"
encoding_rs = "0.8.41"
harper-core = "2.11.0"
harper-typst = "2.11.0"
serde_path_to_error = "0.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28.0", features = ["signal", "user"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
raw-window-handle = "0.6.2"
wry = "=0.57.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Reuse the shaping and mapped-font dependencies already used by egui.
harfrust = "0.12.0"
memmap2 = "0.9.11"
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CGBitmapContext", "CGContext", "CGImage", "CGColorSpace", "CGDataProvider"] }
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKWebView", "WKSnapshotConfiguration", "WKNavigation", "WKNavigationDelegate", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKPreferences", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSColorSpace", "NSScreen", "objc2-core-graphics", "NSApplication", "NSGraphics", "NSImage", "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSEvent", "NSView", "NSWindow", "NSColor", "NSVisualEffectView", "NSAppearance", "block2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSDate", "NSValue", "NSObject", "NSRunLoop", "NSTimer", "NSString", "NSURL", "NSError", "NSFileCoordinator", "NSFileManager", "NSFileVersion", "NSKeyedArchiver", "NSCoder", "block2"] }
# Keep this exact: the application-open bridge augments this release's
# existing delegate instead of replacing winit's lifecycle integration.
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
# Parse architecture-test inputs instead of guessing where test-only code starts.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
tiptoptyp-core = { path = "core", features = ["test-support"] }
egui_kittest = "0.36.1"

[[test]]
name = "native_window_drag"
harness = false

[[test]]
name = "native_window_lifecycle"
harness = false
required-features = ["native-ui-tests"]

[[test]]
name = "native_preview_zoom"
harness = false
required-features = ["desktop-ui-tests"]

[workspace]
members = ["core"]
default-members = [".", "core"]
exclude = ["xtask"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep production optimizations, but retain names and source locations for samplers.
[profile.profiling]
inherits = "release"
debug = "limited"
split-debuginfo = "packed"
strip = "none"

[package.metadata.packager]
out-dir = "target/release"
binaries-dir = "target/release"
product-name = "tiptoptyp"
identifier = "dev.tiptoptyp.editor"
category = "DeveloperTool"
icons = [
    "assets/icons/tiptoptyp-32.png",
    "assets/icons/tiptoptyp-64.png",
    "assets/icons/tiptoptyp-128.png",
    "assets/icons/tiptoptyp-256.png",
    "assets/icons/tiptoptyp-512.png",
    "assets/icons/tiptoptyp-512@2x.png",
    "assets/icons/tiptoptyp.ico",
]
before-packaging-command = "cargo run --manifest-path xtask/Cargo.toml -- package-build --prod"
resources = [
    { src = "toolchain/pdfium-notices", target = "pdfium" },
    { src = "toolchain/payloads", target = "toolchain" },
    { src = "toolchain/shared-assets", target = "assets" },
    { src = "toolchain/liquid", target = "liquid" },
    { src = "THIRD_PARTY_NOTICES", target = "THIRD_PARTY_NOTICES" },
    { src = "toolchain/licenses", target = "licenses" },
    { src = "assets/fonts/notosans/OFL.txt", target = "licenses/NotoSans-OFL.txt" },
    { src = "assets/fonts/notoemoji/OFL.txt", target = "licenses/NotoEmoji-OFL.txt" },
    { src = "assets/fonts/notosanssymbols/OFL.txt", target = "licenses/NotoSansSymbols-OFL.txt" },
    { src = "assets/fonts/notosansmath/OFL.txt", target = "licenses/NotoSansMath-OFL.txt" },
    { src = "assets/fonts/notosanssymbols2/OFL.txt", target = "licenses/NotoSansSymbols2-OFL.txt" },
    { src = "assets/fonts/notosanshebrew/OFL.txt", target = "licenses/NotoSansHebrew-OFL.txt" },
    { src = "assets/fonts/hack/LICENSE.md", target = "licenses/Hack-LICENSE.md" },
    { src = "assets/fonts/nerd/LICENSE.md", target = "licenses/NerdFont-LICENSE.md" },
    { src = "assets/fonts/README.md", target = "font-provenance.md" },
    { src = "assets/handwriting/LICENSE", target = "licenses/Detypify-MIT.txt" },
    { src = "assets/handwriting/DETEXIFY-LICENSE", target = "licenses/Detexify-MIT.txt" },
    { src = "assets/handwriting/HYPERREF-LICENSE", target = "licenses/Hyperref-LPPL.txt" },
    { src = "assets/handwriting/UNICODEIT-LICENSE", target = "licenses/UnicodeIt-LPPL.txt" },
    { src = "assets/handwriting/README.md", target = "handwriting-provenance.md" },
    { src = "assets/liquid/SACREMOSES-LICENSE", target = "licenses/Sacremoses-MIT.txt" },
    { src = "toolchain/provenance", target = "toolchain-provenance" },
]
file-associations = [
    { extensions = ["typ"], name = "Typst document", role = "editor" },
    { extensions = ["tex"], name = "LaTeX document", role = "editor" },
    { extensions = ["txt", "md", "markdown", "json", "toml", "yaml", "yml", "xml", "html", "css", "js", "ts", "rs", "py", "sh"], name = "Text document", role = "editor" },
    { extensions = ["pdf"], name = "PDF document", role = "viewer" },
    { extensions = ["png", "jpg", "jpeg", "gif", "webp", "bmp", "ico", "tif", "tiff"], name = "Image", role = "viewer" },
]

[package.metadata.packager.macos]
minimum-system-version = "12.0"
# Produces a locally runnable, internally consistent bundle. Distribution
# builds should replace this with their Developer ID identity and notarize.
signing-identity = "-"
entitlements = "packaging/macos-local.entitlements.plist"

# macOS surface identity must include the thread-current OpenGL context.
[patch.crates-io]
glutin = { path = "vendor/glutin" }

# Bind deferred viewports to their native windows without focus-based discovery.
eframe = { path = "vendor/eframe" }

# Embedded previews must render in background windows without activating macOS.
wry = { path = "vendor/wry" }

# Large model integrity checks must stay fast during ordinary cargo run builds.
[profile.dev.package.sha2]
opt-level = 3
